name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (tests on Java ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last version listed becomes the default JDK; Gradle itself runs on Java 21.
          java-version: |
            ${{ matrix.test-java }}
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: >-
          ./gradlew build
          -PtestJavaVersion=${{ matrix.test-java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.test-java }}_X64
      - name: Upload plugin
        if: matrix.test-java == 21
        uses: actions/upload-artifact@v7
        with:
          name: devbuild-hpi
          path: build/libs/*.hpi
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-java-${{ matrix.test-java }}
          path: build/reports/

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build release version
        run: ./gradlew build -Pversion="${GITHUB_REF_NAME#v}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/libs/devbuild.hpi
          --title "DevBuild Discord Publisher ${GITHUB_REF_NAME#v}"
          --generate-notes
